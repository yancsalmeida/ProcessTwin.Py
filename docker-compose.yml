services:
  process-twin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: process-twin
    ports:
      - "8000:8000"
    environment:
      - PROCESS_TWIN_DB=/app/data/processtwin.db
      - PYTHONUNBUFFERED=1
      - TELEMETRY_ENGINE_URL=http://industrial-telemetry-api:5100
      - TELEMETRY_INGESTION_MODE=channel
      - CHEMFLOW_ENGINE_URL=http://chemflow-api:5080
    volumes:
      - twin-data:/app/data
      - ../ReactorCore.C/libreactorcore.so:/usr/local/lib/libreactorcore.so:ro
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/telemetry/current')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  twin-data:

networks:
  default:
    name: chemical_software_portfolio_net
