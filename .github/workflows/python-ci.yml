name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Build ReactorCore.C shared library for FFI tests
        run: |
          git clone --depth 1 https://github.com/yancsalmeida/ReactorCore.C.git /home/runner/work/ReactorCore.C || git clone --depth 1 https://github.com/yancsalmeida/ReactorCore.C.git ../ReactorCore.C
          if [ -d "../ReactorCore.C" ]; then make -C ../ReactorCore.C lib; fi
          if [ -d "/home/runner/work/ReactorCore.C" ]; then make -C /home/runner/work/ReactorCore.C lib; fi

      - name: Run test suite with pytest
        run: uv run pytest -v
